name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: mlai-linux-x86_64.tar.gz
          - os: macos-latest
            asset_name: mlai-macos-arm64.tar.gz
          - os: windows-latest
            asset_name: mlai-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build mlai (release)
        run: cargo build --release -p mlai-cli

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: tar -C target/release -czf ${{ matrix.asset_name }} mlai

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path target/release/mlai.exe -DestinationPath ${{ matrix.asset_name }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
