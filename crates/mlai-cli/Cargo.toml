[package]
name = "mlai-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mlai"
path = "src/main.rs"

[dependencies]
mlai-core = { path = "../mlai-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
mockito = "1"
zip = "8"
