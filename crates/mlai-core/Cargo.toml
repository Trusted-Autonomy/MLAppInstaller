[package]
name = "mlai-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["blocking"] }
zip = "8"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
